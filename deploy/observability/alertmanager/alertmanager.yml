global:
  resolve_timeout: 5m

route:
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: incident-webhook

receivers:
  - name: incident-webhook
    webhook_configs:
      - url: http://incident-router:8080/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
