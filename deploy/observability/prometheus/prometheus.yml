global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: saptm-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:4000

  - job_name: saptm-otel-collector
    static_configs:
      - targets:
          - otel-collector:8888
          - otel-collector:9464

  - job_name: saptm-prometheus
    static_configs:
      - targets:
          - prometheus:9090
