apiVersion: v1
kind: LimitRange
metadata:
  name: saptm-namespace-limits
  labels:
    app.kubernetes.io/component: resource-governance
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 2048Mi
      maxLimitRequestRatio:
        cpu: "8"
        memory: "8"
    - type: PersistentVolumeClaim
      min:
        storage: 1Gi
      max:
        storage: 100Gi
