apiVersion: v1
kind: ResourceQuota
metadata:
  name: saptm-namespace-quota
  labels:
    app.kubernetes.io/component: resource-governance
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "16"
    limits.memory: 20Gi
    pods: "20"
    services: "8"
    secrets: "20"
    configmaps: "20"
    persistentvolumeclaims: "4"
    requests.storage: 80Gi
    count/deployments.apps: "8"
    count/cronjobs.batch: "4"
    count/ingresses.networking.k8s.io: "4"
