  OTEL_EXPORTER_OTLP_ENDPOINT: "http://saptm-otel-collector.saptm-observability.svc.cluster.local:4318"
  DATABASE_BACKUP_RETENTION_DAYS: "14"
  LOG_LEVEL: "info"
