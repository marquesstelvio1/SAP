apiVersion: v1
kind: ConfigMap
metadata:
  name: saptm-runtime-config
data:
  NODE_ENV: "production"
  API_PORT: "4000"
  API_CORS_ORIGINS: "https://app.example.com"
  BETTER_AUTH_URL: "https://app.example.com"
  NEXT_PUBLIC_APP_URL: "https://app.example.com"
