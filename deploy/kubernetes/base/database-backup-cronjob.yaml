apiVersion: batch/v1
kind: CronJob
metadata:
  name: saptm-database-backup
  labels:
    app.kubernetes.io/component: database-backup
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/component: database-backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
          containers:
            - name: pg-dump
              image: postgres:17-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: saptm-runtime-secrets
                      key: DATABASE_URL
                - name: DATABASE_BACKUP_RETENTION_DAYS
                  valueFrom:
                    configMapKeyRef:
                      name: saptm-runtime-config
                      key: DATABASE_BACKUP_RETENTION_DAYS
              command:
                - /bin/sh
                - -ec
                - |
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  backup_file="/backups/saptm-${timestamp}.dump"
                  retention_days="${DATABASE_BACKUP_RETENTION_DAYS:-14}"

                  pg_dump "$DATABASE_URL" \
                    --format=custom \
                    --compress=9 \
                    --no-owner \
                    --no-privileges \
                    --file="$backup_file"

                  find /backups \
                    -type f \
                    -name "saptm-*.dump" \
                    -mtime +"$retention_days" \
                    -delete

                  ls -lh "$backup_file"
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1024Mi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: saptm-database-backups
            - name: tmp
              emptyDir: {}
