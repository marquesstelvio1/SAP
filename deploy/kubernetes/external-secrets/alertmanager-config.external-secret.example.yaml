apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: saptm-alertmanager-config
  namespace: saptm-observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: saptm-vault
    kind: ClusterSecretStore
  target:
    name: saptm-alertmanager-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        alertmanager.yml: |
          global:
            resolve_timeout: 5m

          route:
            group_by:
              - alertname
              - severity
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            receiver: incident-webhook

          receivers:
            - name: incident-webhook
              webhook_configs:
                - url: "{{ .INCIDENT_WEBHOOK_URL }}"
                  send_resolved: true

          inhibit_rules:
            - source_matchers:
                - severity="critical"
              target_matchers:
                - severity="warning"
              equal:
                - alertname
  data:
    - secretKey: INCIDENT_WEBHOOK_URL
      remoteRef:
        key: saptm/<environment>/observability
        property: INCIDENT_WEBHOOK_URL
