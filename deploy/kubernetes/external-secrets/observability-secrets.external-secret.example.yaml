apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: saptm-observability-secrets
  namespace: saptm-observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: saptm-vault
    kind: ClusterSecretStore
  target:
    name: saptm-observability-secrets
    creationPolicy: Owner
  data:
    - secretKey: GRAFANA_ADMIN_USER
      remoteRef:
        key: saptm/<environment>/observability
        property: GRAFANA_ADMIN_USER
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteRef:
        key: saptm/<environment>/observability
        property: GRAFANA_ADMIN_PASSWORD
