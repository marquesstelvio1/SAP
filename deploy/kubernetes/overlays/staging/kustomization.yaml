apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: saptm-staging
resources:
  - ../../base
patches:
  - path: runtime-config-patch.yaml
  - path: resource-quota-patch.yaml
  - path: ingress-patch.yaml
  - path: api-deployment-patch.yaml
  - path: web-deployment-patch.yaml
  - path: api-hpa-patch.yaml
  - path: web-hpa-patch.yaml
images:
  - name: ghcr.io/example/saptm/api
    newName: ghcr.io/example/saptm/api
    newTag: sha-placeholder
  - name: ghcr.io/example/saptm/web
    newName: ghcr.io/example/saptm/web
    newTag: sha-placeholder
