apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saptm-restricted-egress-example
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - api
          - web
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: saptm-observability
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - to:
        - ipBlock:
            cidr: DATABASE_HOST_CIDR
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: EXTERNAL_SECRET_STORE_CIDR
      ports:
        - protocol: TCP
          port: 443
