services:
  - type: web
    name: saptm-api
    runtime: docker
    repo: https://github.com/anomalyco/saptm
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: saptm-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: saptm-redis
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: saptm-web
          property: host
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: saptm-web
          property: host
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: saptm-api
          property: host
      - key: API_CORS_ORIGINS
        fromService:
          type: web
          name: saptm-web
          property: host
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /health/live
    autoDeploy: true

  - type: web
    name: saptm-web
    runtime: docker
    repo: https://github.com/anomalyco/saptm
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: saptm-web
          property: host
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: saptm-api
          property: host
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: saptm-web
          property: host
      - key: BETTER_AUTH_SECRET
        fromService:
          type: web
          name: saptm-api
          property: envVar
          envVarKey: BETTER_AUTH_SECRET
      - key: DATABASE_URL
        fromService:
          type: web
          name: saptm-api
          property: envVar
          envVarKey: DATABASE_URL
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: saptm-postgres
    plan: starter
    version: "16"

redis:
  - name: saptm-redis
    plan: starter
    version: "7"
