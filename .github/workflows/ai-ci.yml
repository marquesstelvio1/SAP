name: AI CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      domain:
        description: Target domain
        required: false
        default: frontend
      task_id:
        description: Optional task id
        required: false
      feature:
        description: Task title
        required: false
        default: bootstrap-task

jobs:
  validate-operating-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate core structure
        shell: pwsh
        run: |
          ./scripts/Test-AIOS.ps1

  generate-delivery-artifacts:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate-operating-system
    steps:
      - uses: actions/checkout@v4
      - name: Generate delivery artifacts
        shell: pwsh
        run: |
          & ./scripts/Invoke-AIWorkflow.ps1 `
            -Workflow delivery `
            -Domain '${{ github.event.inputs.domain }}' `
            -TaskId '${{ github.event.inputs.task_id }}' `
            -Feature '${{ github.event.inputs.feature }}'
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-delivery-artifacts
          path: |
            .ai/tasks
            .ai/reports
            .ai/commits
            .ai/executions
