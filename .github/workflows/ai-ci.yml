name: AI CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      domain:
        description: Target domain
        required: false
        default: frontend
      task_id:
        description: Optional task id
        required: false
      feature:
        description: Task title
        required: false
        default: bootstrap-task

jobs:
  validate-operating-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate core structure
        shell: bash
        run: |
          node ./scripts/test-aios.mjs

  generate-delivery-artifacts:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate-operating-system
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate delivery artifacts
        shell: bash
        run: |
          node ./scripts/invoke-ai-workflow.mjs \
            --workflow delivery \
            --domain '${{ github.event.inputs.domain }}' \
            --task-id '${{ github.event.inputs.task_id }}' \
            --feature '${{ github.event.inputs.feature }}'
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-delivery-artifacts
          path: |
            .ai/tasks
            .ai/reports
            .ai/commits
            .ai/executions
