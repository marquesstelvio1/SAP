name: AI Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_name:
        description: Release label
        required: false

jobs:
  generate-release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build changelog and release report
        shell: pwsh
        run: |
          $releaseName = '${{ github.event.inputs.release_name }}'
          if ([string]::IsNullOrWhiteSpace($releaseName)) {
            $releaseName = "main-${{ github.sha }}"
          }
          & ./scripts/New-AIChangelog.ps1 -ReleaseName $releaseName
          & ./scripts/Invoke-AIWorkflow.ps1 -Workflow release -ReleaseName $releaseName
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-release-artifacts
          path: |
            CHANGELOG.md
            .ai/executions

