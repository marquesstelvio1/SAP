name: AI Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_name:
        description: Release label
        required: false

jobs:
  generate-release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build changelog and release report
        shell: bash
        run: |
          RELEASE_NAME="${{ github.event.inputs.release_name }}"
          [ -z "$RELEASE_NAME" ] && RELEASE_NAME="main-${{ github.sha }}"
          node ./scripts/new-ai-changelog.mjs --release-name "$RELEASE_NAME"
          node ./scripts/invoke-ai-workflow.mjs --workflow release --release-name "$RELEASE_NAME"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-release-artifacts
          path: |
            CHANGELOG.md
            .ai/executions

