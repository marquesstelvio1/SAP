name: Container CI

on:
  pull_request:
    paths:
      - ".github/workflows/container-ci.yml"
      - ".dockerignore"
      - "apps/**/Dockerfile"
      - "apps/**/src/**"
      - "apps/**/app/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "compose.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container-ci.yml"
      - ".dockerignore"
      - "apps/**/Dockerfile"
      - "apps/**/src/**"
      - "apps/**/app/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "compose.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            image_suffix: api
          - service: web
            dockerfile: apps/web/Dockerfile
            image_suffix: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image namespace
        id: image
        shell: bash
        run: echo "namespace=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image.outputs.namespace }}/${{ matrix.image_suffix }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=saptm-${{ matrix.service }}
            org.opencontainers.image.description=SAPTM ${{ matrix.service }} runtime image
            org.opencontainers.image.vendor=SAPTM

      - name: Build and optionally push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true

      - name: Resolve primary image reference
        id: image-ref
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          primary_tag="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          echo "ref=$primary_tag" >> "$GITHUB_OUTPUT"

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@v0.29.2
        with:
          image-ref: ${{ steps.image-ref.outputs.ref }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-${{ matrix.service }}.json
          exit-code: "1"

      - name: Upload vulnerability scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}-${{ github.sha }}
          path: trivy-${{ matrix.service }}.json
          if-no-files-found: ignore

      - name: Install Cosign
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign published image digest
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ steps.image.outputs.namespace }}/${{ matrix.image_suffix }}
        run: |
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "Image digest is required for signing."
            exit 1
          fi
          cosign sign --yes "$IMAGE_NAME@$IMAGE_DIGEST"

      - name: Verify published image signature
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ steps.image.outputs.namespace }}/${{ matrix.image_suffix }}
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container-ci.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_NAME@$IMAGE_DIGEST"
