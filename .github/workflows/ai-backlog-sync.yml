name: AI Backlog Sync

on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      domain:
        description: Target domain
        required: true
        default: frontend
      feature:
        description: Task title
        required: true
      priority:
        description: Priority
        required: false
        default: high
      task_id:
        description: Optional task id
        required: false

jobs:
  generate-task-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate task, tests, and integration payloads
        shell: bash
        run: |
          DOMAIN="${{ github.event.inputs.domain }}"
          FEATURE="${{ github.event.inputs.feature }}"
          PRIORITY="${{ github.event.inputs.priority }}"
          TASK_ID="${{ github.event.inputs.task_id }}"

          [ -z "$DOMAIN" ] && DOMAIN="frontend"
          [ -z "$FEATURE" ] && FEATURE="scheduled-backlog-refresh"
          [ -z "$PRIORITY" ] && PRIORITY="high"

          OUTPUT=$(node ./scripts/new-ai-task-bundle.mjs \
            --domain "$DOMAIN" \
            --feature "$FEATURE" \
            --priority "$PRIORITY" \
            ${TASK_ID:+--task-id "$TASK_ID"})
          TASK_FILE=$(echo "$OUTPUT" | head -1)
          TASK_ID=$(basename "$TASK_FILE" .md)

          node ./scripts/new-ai-test-plan.mjs --domain "$DOMAIN" --task-id "$TASK_ID"
          node ./scripts/new-ai-documentation-pack.mjs \
            --domain "$DOMAIN" \
            --task-id "$TASK_ID" \
            --summary "Backlog sync documentation pack for $FEATURE"
      - name: Upload backlog artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-backlog-artifacts
          path: |
            .ai/tasks
            .ai/reports

